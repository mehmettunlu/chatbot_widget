services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_data:/app/chroma_data
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "cd /app/widget && npm install && npm run build && npx serve /app -l 3000 --no-clipboard"
    ports:
      - "3000:3000"
    restart: unless-stopped
